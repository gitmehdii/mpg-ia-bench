services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mpg
      POSTGRES_PASSWORD: mpg
      POSTGRES_DB: mpg
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpg"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  pgdata:
