[project]
name = "mpg-ia-bench"
version = "0.1.0"
description = "Fantasy football engine reproducing MPG mechanics (portfolio build)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.7"]
# Bundles real PostgreSQL binaries, so the `db` suite runs without Docker or root.
pg = ["pgserver>=0.1.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["db: requires a live PostgreSQL database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # Unpacking a fixture tuple and using only part of it is the clearest way to
    # write these tests; naming the unused halves adds noise, not information.
    "RUF059",
]
# User-facing strings are French, and French typography is not a homoglyph attack:
# the curly apostrophe, the em dash and the true minus sign are all correct here.
allowed-confusables = ["\u2019", "\u2014", "\u2013", "\u2212", "\u00a0"]

[tool.ruff.lint.isort]
# `tests/` is on the path via `pythonpath`, so its helpers are first-party.
known-first-party = ["mpg", "fixtures"]

[tool.ruff.lint.per-file-ignores]
# Test helpers deliberately import inside functions to keep the fixtures readable.
"tests/*" = ["B008"]
